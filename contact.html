<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Sonali Parihar</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header>
  <h1>Let's Connect</h1>
  <p>Have a project, collaboration idea, or internship opportunity? I'd love to hear from you.</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="contact.html">Contact</a>
</nav>

<section class="contact-section">
  <div class="contact-wrapper">

    <aside class="contact-info">
      <h2>Get In Touch</h2>

      <div class="info-card">
        <i class="fa-solid fa-envelope"></i>
        <div><h3>Email</h3><p>pariharsonalid@gmail.com</p></div>
      </div>

      <div class="info-card">
        <i class="fa-solid fa-phone"></i>
        <div><h3>Phone</h3><p>+1 (905) 213-1076</p></div>
      </div>

      <div class="info-card">
        <i class="fa-solid fa-location-dot"></i>
        <div><h3>Location</h3><p>Kemptville, Ontario</p></div>
      </div>

      <div class="map-container">
        <iframe src="https://maps.google.com/maps?q=Kemptville%20Ontario&t=&z=11&ie=UTF8&iwloc=&output=embed"></iframe>
      </div>
    </aside>

    <div class="contact-card">
      <h2>Send Message</h2>

      <form id="contactForm">
        <div class="form-group">
          <label for="name" >Full Name</label>
          <input type="text" id="name" required>
          <small class="error"></small>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
          <small class="error"></small>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" required>
          <small class="error"></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
          <small class="error"></small>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="footer-social">
    <a  aria-label="LinkedIn Profile" href="https://www.linkedin.com/in/sonali-parihar-626951a4/" target="_blank"  rel="noopener noreferrer"> <i class="fa-brands fa-linkedin-in"></i></a>
    <a  aria-label="Twitter Profile" href="https://x.com/sonalidilippar1" target="_blank"><i class="fa-brands fa-github"  rel="noopener noreferrer"></i></a>
    <a  aria-label="Instragram Profile" href="https://www.instagram.com/sonali_parihar6" target="_blank"  rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
  </div>
  <p>&copy; 2026 Sonali Parihar. All Rights Reserved.</p>
</footer>


<script>
const form=document.getElementById("contactForm");
form.addEventListener("submit",function(e){
e.preventDefault();
alert("Message sent successfully!");
form.reset();
});
</script>

</body>
</html>
